<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div {
        position: relative;
        width: 400px;
        height: 400px;
      }
      div p {
        width: 100%;
        height: 100%;
        clip-path: url(#path1);
      }
      div p img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      svg {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <p><img src="../images/photo1.jpg" alt="photo1" /></p>
      <svg>
        <clipPath id="path1" clipPathUnits="objectBoundingBox">
          <polygon
            class="st0"
            points="0.78,0.991 0.49,0.813 0.189,0.961 0.257,0.619 0.027,0.362 0.359,0.328 0.517,0.022 0.654,0.343 
	0.983,0.41 0.735,0.643 "
          />
        </clipPath>
      </svg>
    </div>
  </body>
</html>
