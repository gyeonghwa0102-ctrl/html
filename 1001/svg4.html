<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div {
        position: relative;
        width: 450px;
        height: 500px;
      }
      div p {
        width: 100%;
        height: 100%;
        clip-path: url(#path1);
        background-size: cover;
        animation: bg 2s infinite alternate;
      }
      svg {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
      }
      @keyframes bg {
        0% {
          background-image: url(../images/photo1.jpg);
        }
        100% {
          background-image: url(../images/photo2.jpg);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <p></p>
      <svg>
        <clipPath id="path1" clipPathUnits="objectBoundingBox">
          <path
            class="st0"
            d="M0.499,0.978L0.499,0.978C0.209,1.084-0.008,0.872,0.02,0.495v0C-0.063,0.23,0.133,0.013,0.499,0.013h0
	c0.332-0.054,0.529,0.178,0.479,0.482v0C1.074,0.866,0.856,1.081,0.499,0.978z"
          />
        </clipPath>
      </svg>
    </div>
  </body>
</html>
