<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 1749px/ 1770px  */
      * {
        margin: 0;
        padding: 0;
      }
      .con {
        width: 1749px;
        height: 1770px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, 1fr) 2fr;
        grid-template-rows: repeat(4, 1fr);
        gap: 20px;
      }
      .con .item {
        position: relative;
        overflow: hidden;
        border-radius: 25px;
      }
      .con .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;

        transition: 0.5s;
      }
      .con .item .txt {
        position: absolute;
        left: 0;
        top: 0;
        padding: 50px 50px;
        color: #fff;
        font-family: "Pretendard";
        text-transform: uppercase;
      }
      .con .item .txt h2 {
        font-size: 38px;
      }
      .con .item .txt p {
        font-size: 25px;
        font-weight: 600;
      }
      .con .item:hover img {
        transform: scale(1.1);
      }
      .con .item:nth-child(1) {
        grid-column: 1 / 4;
      }
      .con .item:nth-child(2) {
        grid-column: 1 / 3;
      }
      .con .item:nth-child(3) {
        grid-column: 1;
        grid-row: 3;
      }
      .con .item:nth-child(4) {
        grid-column: 2;
        grid-row: 3;
      }
      .con .item:nth-child(5) {
        grid-column: 3/4;
        grid-row: 2/4;
      }
      .con .item:nth-child(6) {
        grid-column: 1 / 3;
      }
      .con .item:nth-child(7) {
        grid-column: 3 / 4;
      }
    </style>
  </head>
  <body>
    <div class="con">
      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_1945-1967.webp"
          alt=""
        />
        <div class="txt">
          <p>1945-1966</p>
          <h2>제빵업에 몸담다</h2>
        </div>
      </div>
      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_1968-1982.webp"
          alt=""
        />
        <div class="txt">
          <p>1968-1977</p>
          <h2>혁신과 성장</h2>
        </div>
      </div>

      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_1983-1996.webp"
          alt=""
        />
        <div class="txt">
          <p>1983-1996</p>
          <h2>프랜차이즈 <br />사업으로 진화</h2>
        </div>
      </div>
      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_1997-2003.webp"
          alt=""
        />
        <div class="txt">
          <p>1998-2002</p>
          <h2>시련극복과 도약</h2>
        </div>
      </div>
      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_2004-2009.webp"
          alt=""
        />
        <div class="txt">
          <p>2004-2007</p>
          <h2>spc그룹으로 재탄생</h2>
        </div>
      </div>
      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_2010-2015.webp"
          alt=""
        />
        <div class="txt">
          <p>2012-2014</p>
          <h2>글로벌 제빵기업으로 자리매김</h2>
        </div>
      </div>
      <div class="item">
        <img
          src="https://spc.co.kr/img/front/sub/heritage/heritage_2016-now.webp"
          alt=""
        />
        <div class="txt">
          <p>2019-현재</p>
          <h2>great food company</h2>
        </div>
      </div>
    </div>
  </body>
</html>
