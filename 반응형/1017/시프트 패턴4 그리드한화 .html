    <meta charset="UTF-8" />

    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul.company {
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        padding: 0 80px;
      }
      ul.company li {
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        padding: 25px 22px;
        box-sizing: border-box;
        position: relative;
      }
      ul.company li::after {
        content: "→";
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid #e5e5e5;
        text-align: center;
        line-height: 26px;
        color: #616161;
      }
      ul.company li:hover::after {
        background: #f37321;
        color: #fff;
        border: none;
      }
      ul.company li a {
        display: block;
      }
      ul.company li a img {
        width: 100%;
        object-fit: cover;
      }
      ul.company:nth-child(1) {
        grid-column: 1;
      }
      ul.company:nth-child(2) {
        grid-column: 2;
      }
      ul.company:nth-child(3) {
        grid-column: 3;
      }
      @media screen and (max-width: 1024px) {
      }
      @media screen and (max-width: 768px) {
        ul.company {
          grid-template-columns: 1fr 1fr;
        }
        ul.company li:hover::after {
          background: none;
          border: 1px solid #e5e5e5;
          color: #616161;
        }
      }
      @media screen and (max-width: 670px) {
        ul.company {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
