<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .con {
        width: 100%;
        max-width: 1680px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 10px;
        padding: 0 20px;
      }
      .con div {
        overflow: hidden;
        position: relative;
        border-radius: 20px;
      }
      .con div img {
        transition: 0.5s;
        width: 100%;
        object-fit: cover;
      }
      .con div .txt {
        font-family: "Pretendard";
        position: absolute;
        left: 10%;
        top: 30%;
        color: #fff;
      }
      .con div .txt h1 {
        margin-bottom: 20px;
      }
      .con div .txt p {
        margin-bottom: 10px;
      }
      .con div:hover img {
        transform: scale(1.1);
      }
      @media screen and (max-width: 1280px) {
        .con {
          grid-template-columns: 1fr 1fr;
        }
        .con div:nth-child(1) {
          grid-column: 1 / span 2;
        }
      }
      @media screen and (max-width: 640px) {
        .con {
          grid-template-columns: 1fr;
          grid-auto-rows: 350px;
        }
        .con div:nth-child(1) {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="con">
      <div>
        <img
          src="https://www.samsungshi.com/images/main/mRecruit_bg_01.jpg"
          alt=""
        />
        <div class="txt">
          <h1>채용절차</h1>
          <p>글로벌 전문가 양성을 위한 <br />신입사원부터 경력사원까지</p>
        </div>
      </div>
      <div>
        <img
          src="https://www.samsungshi.com/images/main/mRecruit_bg_02.jpg"
          alt=""
        />
        <div class="txt">
          <h1>채용공고</h1>
          <p>삼성인이 지향하는 열정과 <br />도전정신을 갖춘 인재를 찾습니다.</p>
        </div>
      </div>
      <div>
        <img
          src="https://www.samsungshi.com/images/main/mRecruit_bg_03.jpg"
          alt=""
        />
        <div class="txt">
          <h1>회사생활</h1>
          <p>보다 질 높은 삶을 추구할 수 있도록 <br />적극적으로 지원합니다.</p>
        </div>
      </div>
    </div>
  </body>
</html>
