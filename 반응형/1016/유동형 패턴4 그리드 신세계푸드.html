<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @font-face {
    font-family: 'NanumBarunGothic';
    src: url('//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.eot');
    font-weight: 400;
    font-display: swap;
}
    *{margin: 0;padding: 0;}
    a{
      text-decoration: none;
      color: #333;
    }
    #con{
      width: 80%;
      max-width: 940px;
      margin: 0 auto;
      gap: 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }
    #con> div:nth-child(1){
      grid-column: 1/2;
    }
    #con> div:nth-child(2){
      grid-column: 2/3;
    }
    #con div img{
      border: 1px solid #acacac;
      object-fit: cover;
      width: 100%;
    }
    #con >div .txt{
      font-family: 'NanumBarunGothic';
      position: relative;
      margin-top: 35px;
      padding-left: 18px;
      font-size: 15px;
      letter-spacing: -0.5px;
      line-height: 29px;
      word-break: keep-all;
    }
    #con > div .txt>h4{
      font-size: 20px;
      padding-bottom: 5px;
    }
    #con > div .txt p{
      color: #444;
    }
    #con > div .txt>a{
      color: #fff;
      background: #acacac;
      border-radius: 5px ;
      padding: 5px;
    }
    #con >div .txt::before{
      content: "";
      position: absolute;
      top: 5px;
      left: 0;
      width: 3px;
      height: 90%;
      background:#cbcbcb ;
    }
    @media screen and (max-width:1024px) {
      #con > div .txt h4{font-size: 14px}
      #con > div .txt {font-size: 14px; margin-top: 15px;}
      #con > div .txt br .mo{display: none;}}

    @media screen and (max-width:768px){
      #con {gap: 20px;}}
      
    @media screen and (max-width:480px) {
      #con {grid-template-columns: 1fr;}}

  </style>
</head>
<body>
  <div id="con">
    <div>
      <p><img src="https://www.shinsegaefood.com/images/background/bg_evf_img_01.png" alt=""></p>
      <div class="txt">
        <h4>음성공장 태양열발전</h4>
        <p>음성공장 상부 유휴부지를 활용하여 신재생에너지를 생산하여 <br class="mo">가스(LNG)를 대체하여 사용하고 있습니다.</p>
        <a href="#">태양열에너지 사용현황</a>
      </div>
    </div>
  <div>
      <p><img src="https://www.shinsegaefood.com/images/background/bg_evf_img_02.png" alt=""></p>
      <div class="txt">
        <h4>친환경패키징 확대</h4>
        <p>식품제조 시 사용되는 용기를 탄소중립형 포장재, <br class="mo">대체 플라스틱 적용을 확대하고 있습니다.</p>
    </div>
  </div>
    <div>
      <p><img src="https://www.shinsegaefood.com/images/background/bg_evf_img_05.png" alt=""></p>
      <div class="txt">
        <h4>(협력회사)친환경 경영 독려</h4>
        <p>2021년부터 (물류 등)협력회사 입찰평가 시 ESG경영 우수 실천 <br class="mo">협력사 대상 가점 부여를 통해 ESG 영향력 전파에 앞장서고 있습니다.</p>
    </div>
  </div>
</body>
</html>
</html>
