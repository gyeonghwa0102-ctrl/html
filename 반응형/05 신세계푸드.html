<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      section {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
      }
      section ul {
        width: 100%;
        gap: 3vw;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }
      section ul li {
        overflow: hidden;
        border-radius: 20px;
      }
      section ul li img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      section ul li:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
      }
      section ul li:nth-child(2) {
        grid-column: 2;
        grid-row: 1;
      }
      section ul li:nth-child(3) {
        grid-column: 1;
        grid-row: 2;
      }
      section ul li:nth-child(4) {
        grid-column: 2;
        grid-row: 2;
      }
      section ul li:nth-child(5) {
        grid-column: 1;
        grid-row: 3;
      }
      /* @media screen and(max-width:1024px) {
        section ul li {
          height: 800px;
        }
      } */
      @media screen and(max-width:960px) {
        section ul li {
          /* height: 600px; */
          border-radius: 20px;
        }
      }
      /* @media screen and(max-width:500px) {
        section ul li {
          height: 400px;
        }
      } */
    </style>
  </head>
  <body>
    <section>
      <ul>
        <li>
          <img
            src="https://www.shinsegaefood.com/images/business/business_item_hotelCollection.jpg"
            alt=""
          />
        </li>
        <li>
          <img
            src="https://www.shinsegaefood.com/images/business/business_item_vecchiaEnuovo.jpg"
            alt=""
          />
        </li>
        <li>
          <img
            src="https://www.shinsegaefood.com/images/business/business_item_olbaan.jpg"
            alt=""
          />
        </li>
        <li>
          <img
            src="https://www.shinsegaefood.com/images/business/business_item_brand.jpg"
            alt=""
          />
        </li>
        <li>
          <img
            src="https://www.shinsegaefood.com/images/business/business_item_recette.jpg"
            alt=""
          />
        </li>
      </ul>
    </section>
  </body>
</html>
