<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        /* margin: 0;
        padding: 0; */
      }
    </style>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>회원가입</legend>
        <p>
          아이디:
          <input
            type="text"
            maxlength="10"
            minlength="5"
            size="10"
            placeholder="아이디 입력"
            onfocus="this.placeholder=''"
          />
        </p>
        <p>
          비밀번호:
          <input
            type="password"
            size="10"
            placeholder="비밀번호 입력"
            onfocus="this.placeholder=''"
            required
          />
        </p>
        <p>
          검색:
          <input
            type="search"
            size="10"
            placeholder="검색 입력"
            onfocus="this.placeholder=''"
          />
        </p>
        <p>
          이메일:
          <input
            type="email"
            size="10"
            placeholder="이메일 입력"
            onfocus="this.placeholder=''"
          />
        </p>

        <p><input type="submit" /></p>
      </fieldset>
    </form>
  </body>
</html>
