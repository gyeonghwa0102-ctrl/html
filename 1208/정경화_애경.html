<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
        width: 1400px;
        margin: 0 auto;
        font-family: "Pretendard";
      }
      .tab_top {
        display: flex;
        justify-content: space-between;
        padding-bottom: 68px;
        box-sizing: border-box;
        margin-top: 100px;
      }
      .left h2 {
        font-size: 46px;
        font-weight: bold;
      }
      .right {
        display: flex;
      }
      .right span {
        display: block;
        font-size: 15px;
        color: #16161699;
        margin-bottom: 9px;
      }
      .right p {
        font-size: 20px;
        text-align: right;
        font-weight: bold;
      }
      .right #box {
        margin-right: 58px;
      }
      hr {
        margin-bottom: 40px;
      }
      .con {
        position: relative;
      }
      .con #box {
        position: absolute;
        display: none;
      }
      .con #box.on {
        display: block;
        display: flex;
        gap: 290px;
      }
      .con #box h3 {
        margin-bottom: 80px;
        font-size: 22px;
        font-weight: 300;
      }
      .con #box p {
        width: 180px;
        background-color: #f8f8f8;
        font-size: 15px;
        border-radius: 50px;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        cursor: pointer;
      }
      .con #box p:hover {
        background-image: linear-gradient(to top, #f5e7f0, #fad7d7) !important;
      }
      .img img {
        width: 800px;
        object-fit: cover;
        border-radius: 20px;
      }
      .onn {
        text-decoration: underline;
        text-underline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <div class="tab_top">
      <div class="left">
        <h2>
          Sustainable <br />
          Love & Respect
        </h2>
      </div>
      <div class="right">
        <div class="en" id="box">
          <a href="#">
            <span>Environmental</span>
            <p>환경</p>
          </a>
        </div>
        <div class="so" id="box">
          <a href="#">
            <span>Social</span>
            <p>사회</p>
          </a>
        </div>
        <div class="go" id="box">
          <a href="#">
            <span>Governance</span>
            <p>지배구조</p>
          </a>
        </div>
      </div>
    </div>
    <hr />
    <div class="con">
      <div id="box">
        <div class="tleft" id="en">
          <h3>애경산업은 지속가능한 환경을 위해 <br />책임을 다하겠습니다.</h3>
          <p>바로가기<span>→</span></p>
        </div>
        <div class="img">
          <img
            src="https://www.aekyung.co.kr/img/front/main/mo_main_tab01.png"
            alt="en"
          />
        </div>
      </div>
      <div id="box">
        <div class="tleft" id="so">
          <h3>
            애경산업의 노력은 <br />
            임직원과 협력사, 지역사회 <br />
            그리고 고객이 함께하는 향기로운 동행이 될 것입니다.
          </h3>
          <p>바로가기<span>→</span></p>
        </div>
        <div class="img">
          <img
            src="https://www.aekyung.co.kr/img/front/main/mo_main_tab02.png"
            alt="en"
          />
        </div>
      </div>
      <div id="box">
        <div class="tleft" id="go">
          <h3>투명하고 건전한 기업 활동을 이어나가겠습니다.</h3>
          <p>바로가기<span>→</span></p>
        </div>
        <div class="img">
          <img
            src="https://www.aekyung.co.kr/img/front/main/mo_main_tab03.png"
            alt="en"
          />
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
      $(document).ready(function () {
        $(".right .en p").eq(0).trigger("click");
      });
      $(".right a").click(function (e) {
        e.preventDefault();
        $(".right .en p").removeClass("onn");
        $(this).find("p").addClass("onn");
        $(".right .so p").removeClass("onn");
        $(this).find("p").addClass("onn");
        $(".right .go p").removeClass("onn");
        $(this).find("p").addClass("onn");
      });

      $(".right a").click(function () {
        let idx = $(this).parent().index();
        $(".con > #box").removeClass("on");
        $(".con > #box").eq(idx).addClass("on");
      });
    </script>
  </body>
</html>
