<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
        font-family: "NanumSquareRound";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff")
          format("woff");
        font-weight: normal;
        font-display: swap;
      }
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }

      section {
        height: 100vh;
        position: sticky;
        top: 0;
        padding: 80px;
      }
      section video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        left: 0;
        top: 0;
      }
      section .txt {
        position: relative;
        height: 100%;
        z-index: 1;
        color: #fff;
        display: flex;
      }
      section .txt h1 {
        width: 580px;
        font-weight: bold;
        font-size: 70px;
        height: 100%;
        padding-top: 160px;
        position: absolute;
        top: 0;
        left: 70%;
      }
      section:nth-child(4) .txt h1 {
        font-size: 128px;
        position: absolute;
        left: 50%;
      }
      section .txt p {
        flex: 1;
        font-size: 24px;
        position: absolute;
        bottom: 15%;
        left: 5%;
        font-family: "NanumSquareRound";
      }
      footer {
        background-color: #000;
        height: 1000px;
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div>
      <section>
        <video autoplay muted loop>
          <source
            src="https://www.taekwanggroup.co.kr/UPLOAD/MAIN_MOVIE/FILE20250310181255pypNd.mp4"
          />
        </video>
        <div class="txt">
          <p>연결(Connection) 미래(Future) 빛(Light)</p>
          <h1>
            Connection the <br />
            Future with Light
          </h1>
        </div>
      </section>
      <section>
        <video autoplay muted loop>
          <source
            src="https://www.taekwanggroup.co.kr/UPLOAD/MAIN_MOVIE/main_visual_2.mp4"
          />
        </video>
        <div class="txt">
          <p>가치(Value) 고객(Customer) 지속가능성(Sustainability)</p>
          <h1>
            Add Value to <br />
            Your Everyday
          </h1>
        </div>
      </section>
      <section>
        <video autoplay muted loop>
          <source
            src="https://www.taekwanggroup.co.kr/UPLOAD/MAIN_MOVIE/main_visual_3.mp4"
          />
        </video>
        <div class="txt">
          <p>꿈(Dream) 희망(Hope) 열정(Passion)</p>
          <h1>Awaken <br />Imagination, <br />Shape the Future</h1>
        </div>
      </section>
      <section>
        <video autoplay muted loop>
          <source
            src="https://www.taekwanggroup.co.kr/UPLOAD/MAIN_MOVIE/main_visual_4.mp4"
          />
        </video>
        <div class="txt">
          <p>숲과 함께 자라는 나무, 태광이 닮고 싶은 이름입니다</p>
          <h1>Finally, A <br />‘big Forest’ Is <br />Formed</h1>
        </div>
      </section>
    </div>
    <footer></footer>
  </body>
</html>
