<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .con {
        width: 1340px;
        height: 540px;
        margin: 0 auto;
        gap: 13px;
        display: grid;
        grid-template-columns: repeat(4.1fr);
        grid-template-rows: 1fr 1fr;
      }
      .con .item {
        overflow: hidden;
      }
      .con .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .con .item:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
      }
      .con .item:nth-child(2) {
        grid-column: 2;
        grid-row: 1;
      }
      .con .item:nth-child(3) {
        grid-column: 3 /5;
        grid-row: 1;
      }
      .con .item:nth-child(4) {
        grid-column: 1 /3;
        grid-row: 2;
      }
      .con .item:nth-child(5) {
        grid-column: 3;
        grid-row: 2;
      }
      .con .item:nth-child(6) {
        grid-column: 4;
        grid-row: 2;
      }
    </style>
  </head>
  <body>
    <div class="con">
      <div class="item">
        <img src="https://www.cuchen.com/img/b2b_info_01.jpg" alt="" />
      </div>
      <div class="item">
        <img src="https://www.cuchen.com/img/b2b_info_02.jpg" alt="" />
      </div>
      <div class="item">
        <img src="https://www.cuchen.com/img/b2b_info_03.jpg" alt="" />
      </div>
      <div class="item">
        <img src="https://www.cuchen.com/img/b2b_info_04.jpg" alt="" />
      </div>
      <div class="item">
        <img src="https://www.cuchen.com/img/b2b_info_05.jpg" alt="" />
      </div>
      <div class="item">
        <img src="https://www.cuchen.com/img/b2b_info_06.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
