    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      div {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 720px;
        background-size: cover;
      }
      div .list {
        width: 894px;
        height: 454px;
        display: flex;
        gap: 94px 177px;
        flex-wrap: wrap;
      }
      div .list li {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: #222;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bg {
        background-color: #222;
      }
      .bg1 {
        background-image: url(https://weare.lush.co.kr/images/main_value01.jpg);
      }
      .bg2 {
        background-image: url(https://weare.lush.co.kr/images/main_value02.jpg);

      .bg5 {

      }
      .bg6 {
        background-image: url(https://weare.lush.co.kr/images/main_value05.jpg);
      }

    <div>
      <ul class="list">
        <li>

        <li>

        </li>
        <li>

            <img
              src="https://weare.lush.co.kr/images/ico_main_value05.svg"
              alt=""
            />
          </p>
        </li>
        <li>
          <p>
            <img
              src="https://weare.lush.co.kr/images/ico_main_value06.svg"
              alt=""
            />
          </p>
          <p></p>
        </li>
      </ul>

    <script>
      $(".list li").addClass("bg");
      $(".list li").hover(
        function () {
          let i = $(this).index();
          console.log(i);
          $(".list li").removeClass("bg");
          $(this).addClass("bg");
          $("div").removeClass();
          $("div").addClass("bg" + (i + 1));
        },
        function () {
          $(".list li").addClass("bg");
        }
      );
      $("div").hover(
        function () {},
        function () {
          $("div").addClass("bg");
        }
      );
    </script>
