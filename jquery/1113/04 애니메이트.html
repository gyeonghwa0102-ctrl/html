<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../jquery-ui.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>러쉬</title>
    <style>
      div {
        height: 500px;
      }
      p {
        width: 100%;
        height: 100%;
        background: #ccc;
        overflow: hidden;
        white-space: nowrap;
      }
      p.bg {
        background-color: #f00;
        transition: 1s;
      }
    </style>
  </head>
  <body>
    <div>
      <p>제이쿼리</p>
    </div>
    <button id="slideleft">slideleft</button>
    <button id="slideright">slideright</button>
    <button id="slide">slidetoggle</button>
    <button id="bg">백그라운드 색상 변경</button>
    <script>
      $("#slideleft").click(function () {
        $("p").animate({ width: "0" }, 1000);
      });
      $("#slideright").click(function () {
        $("p").animate({ width: "100%" }, 1000);
      });

      $("#slide").click(function () {
        if ($("p").width() > 0) {
          $("p").animate({ width: "0" }, 1000);
        } else {
          $("p").animate({ width: "100%" }, 1000);
        }
      });
      // $("#bg").click(function () {
      //   $("p").animate({ backgroundColor: "#f00" }, 1000);
      // });
      $("#bg").click(function () {
        $("p").addClass("bg");
      });
    </script>
  </body>
</html>
