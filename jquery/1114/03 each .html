<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* button:nth-child(1) {

    </style>
  </head>
  <body>
    <button id="stop1">#f00</button>
    <button id="stop2">#0f0</button>
    <button id="stop3">#00f</button>
    <input type="text" value="input태그" />
    <div id="demo"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
      $(function () {
        $("button").each(function (k, v) {});
        console.log(v);
        $(v).css({ "background-color": $(v).text() });
        $(v).click(function () {
          $("body").each(function (k, v) {});
          $(v).css({ "background-color": $(v).text() });
        });
      });
    </script>
  </body>
