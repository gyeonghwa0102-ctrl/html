<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신한카드</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    a{
      text-decoration: none;
      color: #333;
    }
    ul{
      list-style: none;
    }
    ul.list{
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 100px;
      background-color: #f7f8fc;
      padding: 100px;
     
    }
    .list li{
      width: 280px;
      height: 357px;
      border: 1px solid #e5e5e5;
      background-color: #fff;
      border-radius: 24px;
      transition: 0.5s;
    }
    .list li:hover{
      transform: translateY(-40px);
      border: 1px #007aff ;
    }
    .list li a{
      display: flex;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
      box-sizing: border-box;
    }
    .list li a .tit .sub{
      display: flex;
      justify-content: space-between;
    }
    .list li a .tit .sub h1{
      font-size: 24px;
      line-height: 1.5;
      
    }
    .list li a p.imgani{
      width: 120px;
      height: 120px;
      margin: 0 auto;
    }
    .list li:first-child a p.imgani{
      background-image: url(./다운로드.png);
    }
    .list li:first-child a:hover p.imgani{
      background-image: url(./icon_main_data_play.png);
    }
    .list li:nth-child(2) a p.imgani{
      background-image: url(./다운로드2.png);
    }
    .list li:nth-child(2) a:hover p.imgani{
      background-image: url(./icon_main_solution_play.png);

    }
    .list li:nth-child(3) a p.imgani{
      background-image: url(./다운로드3.png);
    }
    .list li:nth-child(3) a:hover p.imgani{
      background-image: url(./icon_main_ad_play3.png);

    }
    .list li:nth-child(4) a p.imgani{
      background-image: url(./다운로드4.png);
    }
    .list li:nth-child(4) a:hover p.imgani{
      background-image: url(./icon_main_api_play.png);   
    }
    .list li a:hover p.imgani{
      background-size: 10920px 120px;
      animation: adplay 3s steps(91) infinite;
    }
    .list li:nth-child(2) a:hover p.imgani{
      background-size: 11040px 120px;
      animation: adplay2 3s steps(92) infinite;
    }
    @keyframes adplay {
      0%{background-position: 0 0;}
      100%{background-position: -10920px 0;}
    }
    @keyframes adplay2 {
      0%{background-position: 0 0;}
      100%{background-position: -11040px 0;}
    }
    .list li .txt{
      background-color: #f1f4fb;
      border-radius: 30px;
      padding: 8px;
      text-align: center;
      font-size: 18px;
      
    }
  </style>
</head>
<body>
  <ul class="list">
    <li>
      <a href="#">
        <div class="tit">
          <p class="sub">
            <span>다양한</span><span>></span>
            <h1>Data서비스</h1>
          </p>
        </div>
        <p class="imgani"></p>
        <p class="txt">Data One-Stop Servise</p>
      </a>
    </li>
    <li>
      <a href="#">
        <div class="tit">
          <p class="sub">
            <span>혁신적인</span><span>></span>
            <h1>솔루션서비스 </h1>
          </p>
        </div>
        <p class="imgani"></p>
        <p class="txt">상권분석, 시장 모니터링</p>
      </a>
    </li>
    <li>
      <a href="#">
        <div class="tit">
          <p class="sub">
            <span>스마트한</span><span>></span>
            <h1>광고서비스 </h1>
          </p>
        </div>
        <p class="imgani"></p>
        <p class="txt">최적의 고객 타겟팅</p>
      </a>
    </li>
    <li>
      <a href="#">
        <div class="tit">
          <p class="sub">
            <span>탁월한</span><span>></span>
            <h1>API서비스</h1>
          </p>
        </div>
        <p class="imgani"></p>
        <p class="txt">Data 실시간 활용</p>
      </a>
    </li>
  </ul>
</body>
</html>
