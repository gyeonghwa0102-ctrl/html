<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .grid-container {
        display: grid;
        width: 1200px;
        margin: 0 auto;
        grid-template-columns: 200px 200px 400px 200px 200px;
        grid-template-areas:
          "hlogo menu menu menu menu"
          "slide slide slide slide slide"
          "c1 c1 c3 c4 c4"
          "fmenu fmenu fmenu fmenu flogo"
          "copyright copyright copyright copyright flogo";
        grid-template-rows: 100px 300px 200px 50px 50px;
      }
      .grid-container .hlogo:nth-child(1) {
        grid-area: hlogo;
        background: #aaa;
      }
      .grid-container .menu:nth-child(2) {
        grid-area: menu;
        background: #bbb;
      }
      .grid-container .slide:nth-child(3) {
        grid-area: slide;
        background: #ccc;
      }
      .grid-container .c1:nth-child(4) {
        grid-area: c1;
        background: #ddd;
      }
      .grid-container .c3:nth-child(5) {
        grid-area: c3;
        background: #eee;
      }
      .grid-container .c4:nth-child(6) {
        grid-area: c4;
        background: #aaa;
      }
      .grid-container .fmenu:nth-child(7) {
        grid-area: fmenu;
        background: #bbb;
      }
      .grid-container .copyright:nth-child(8) {
        grid-area: copyright;
        background: #ccc;
      }
      .grid-container .flogo:nth-child(9) {
        grid-area: flogo;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="hlogo"></div>
      <div class="menu"></div>
      <div class="slide"></div>
      <div class="c1"></div>
      <div class="c3"></div>
      <div class="c4"></div>
      <div class="fmenu"></div>
      <div class="copyright"></div>
      <div class="flogo"></div>
    </div>
  </body>
</html>
