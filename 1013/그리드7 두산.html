<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f7f7f7;
      }
      h2 {
        font-family: "Pretendard";
        color: #151515;
        font-size: 32px;
        font-weight: 500;
        width: 1680px;
        margin: 0 auto;
        padding-bottom: 30px;
      }
      .edu {
        width: 1680px;
        margin: 0 auto;
        height: 780px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-areas: "a b c c" "a d e f";
        grid-template-rows: 1fr 1fr;
        gap: 24px;
      }
      .edu .item:nth-child(1) {
        grid-area: a;
      }
      .edu .item:nth-child(2) {
        grid-area: b;
        background-color: #fff;
        border-radius: 20px;
      }
      .edu .item:nth-child(3) {
        grid-area: c;
      }
      .edu .item:nth-child(4) {
        grid-area: d;
      }
      .edu .item:nth-child(5) {
        grid-area: e;
      }
      .edu .item:nth-child(6) {
        grid-area: f;
        background-color: #fff;
        border-radius: 20px;
      }
      .edu .item:nth-child(2),
      .edu .item:nth-child(6) {
        font-family: "Pretendard";
        padding: 48px 33px;
        line-height: 1.3;
      }
      .edu .item:nth-child(2) h3,
      .edu .item:nth-child(6) h3 {
        font-size: 32px;
        color: #151515;
        padding-bottom: 50px;
      }
      .edu .item:nth-child(2) h3 strong,
      .edu .item:nth-child(6) h3 strong {
        color: #005eb8;
      }
      .edu .item:nth-child(2) p,
      .edu .item:nth-child(6) p {
        font-size: 18px;
        color: #444;
        padding-top: 40px;
      }
    </style>
  </head>
  <body>
    <h2>두산 로봇 교육</h2>
    <div class="edu">
      <div class="item">
        <img
          src="https://www.doosanrobotics.com/images/services/robot-training-img01.png"
          alt=""
        />
      </div>
      <div class="item">
        <h3>
          현장에서 바로 적용 가능한 <br /><strong>최고의 실습 교육</strong>
        </h3>
        <p>
          두산로보틱스에서 개발한 검증된 실무형 교육 커리큘럼으로, 실제 현장에서
          바로 적용하며 시시각각 발생하는 다양한 문제를 해결할 수 있도록
          설계되었습니다.
        </p>
      </div>
      <div class="item">
        <img
          src="https://www.doosanrobotics.com/images/services/robot-training-img02.png"
          alt=""
        />
      </div>
      <div class="item">
        <img
          src="https://www.doosanrobotics.com/images/services/robot-training-img03.png"
          alt=""
        />
      </div>
      <div class="item">
        <img
          src="https://www.doosanrobotics.com/images/services/robot-training-img04.png"
          alt=""
        />
      </div>
      <div class="item">
        <h3>초보자부터 전문가까지 <br /><strong>수준별 교육 제공</strong></h3>
        <p>
          초보자부터 현업 엔지니어 및 교수까지 수준별로 <br />들을 수 있는
          맞춤형 교육이 마련돼 있습니다.
        </p>
      </div>
    </div>
  </body>
</html>
