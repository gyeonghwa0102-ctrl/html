<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
        background-color: #f5ebdc;
        padding: 0 60px;
        width: 100%;
        max-width: 1700px;
        margin: 0 auto;
      }
      h1 {
        font-size: 42px;
        margin-bottom: 24px;
      }
      .cus {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .cus .nopic > div {
        background-color: #fff;
        border-radius: 20px;
        width: 527px;
        height: 227px;
        padding: 20px;
        box-sizing: border-box;
      }
      .cus .nopic > div:first-child {
        margin-bottom: 30px;
      }
      .cus .nopic > div > p {
        width: 50px;
        border-radius: 10px;
        background-color: #f5ebdc;
        text-align: center;
        padding: 10px 16px;
        font-size: 13px;
      }
      .cus .nopic > div > h2 {
        font-size: 22px;
        margin-top: 18px;
      }
      .cus > div {
        background-color: #fff;
        border-radius: 20px;
        width: 527px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .cus > div:first-child {
        background: none;
      }
      .cus > div .txt {
        padding: 20px;
      }
      .cus > div .txt p {
        width: 50px;
        border-radius: 10px;
        background-color: #f5ebdc;
        text-align: center;
        padding: 10px 16px;
        font-size: 13px;
      }
      .cus > div .txt h2 {
        font-size: 22px;
        margin-top: 18px;
        padding-bottom: 38px;
      }
      .cus > div > p img {
        width: 100%;
        position: relative;
        bottom: 0;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <h1>고객과 함께 성장하는 버거킹</h1>
    <div class="cus">
      <div>
        <p>브랜드</p>
        <h2>Since 1954, 전 세계 고객에게 사랑받는 글로벌 브랜드 버거킹!</h2>
      </div>
      <div>
        <p>브랜드</p>
        <h2>Since 1954, 전 세계 고객에게 사랑받는 글로벌 브랜드 버거킹!</h2>
      </div>
      <div>
        <div class="txt">
          <p>브랜드</p>
          <h2>Since 1954, 전 세계 고객에게 사랑받는 글로벌 브랜드 버거킹!</h2>
        </div>
        <p>
          <img
            src="https://mob-prd.burgerking.co.kr/images/story/main/2025/01/20/a16a3f0c-612a-4e80-a687-1b9a37a03df8.png"
            alt=""
          />
        </p>
      </div>
      <div>
        <div class="txt">
          <p>브랜드</p>
          <h2>Since 1954, 전 세계 고객에게 사랑받는 글로벌 브랜드 버거킹!</h2>
        </div>
        <p>
          <img

            alt=""
          />
        </p>
      </div>
    </div>
  </body>
</html>
