<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{margin: 0;padding: 0;}
    ul{
      list-style: none;
    }
    a{
      text-decoration: none;
      color: #333;
    }
    body{
      background-color: #f5ebdc;
    }
    .itro {
        width: 100%;
        max-width: 1620px;
        margin: 0 auto;
        padding: 0 30px; 
        
      }
      .itro h1{
        font-size: 42px;
        margin-bottom: 24px;
      }
      .itro .only{
        display: flex;
        justify-content: space-between;
      }
      .itro .only .box {
        background-color: #fff;
        border-radius: 30px;
        width: 526px;
        height: 508px;
        overflow: hidden;
      }
      .itro .only .box img{
        width: 100%;
        height: 297px;
        object-fit: cover;
      }
      .itro .only .box .txt{
        padding: 20px;
      }
      .itro .only .box .txt >p:first-child{
        background-color: #f5ebdc;
        width: 60px;
        text-align: center;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
      }
      .itro .only .box .txt p:nth-child(2){
        margin: 15px;
        font-size: 22px;
      }
      
      .itro .only .box .txt .btn{
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }
      .itro .only .box .txt .btn p{
        font-size: 20px;
      }
      .itro .only .box .txt .btn p img{
        height: 34px;
        
      }
      .itro .only .box:last-child .txt{
        text-align: center;
        padding: 64px 20px 20px 20px;

      }
      .deli{
        background-color: #502314;
      }
  </style>
</head>
<body>
   <div class="itro">
      <h1>메뉴와 매장소개, Why 버거킹</h1>
        <div class="only">
          <div class="box">
            <div class="txt">
              <p>메뉴소개</p>
              <p>버거킹만이 드릴 수 있는 특별한 맛을 소개합니다</p>
              <div class="btn">
                <p>메뉴 둘러보기</p>
                <p><img src="	https://www.burgerking.co.kr/img/ico_move.svg" alt="">
              </div>
              </p>
            </div>
            <p>
              <img
                src="https://mob-prd.burgerking.co.kr/images/story/main/2025/01/20/fb8997c7-170d-484c-a48b-fc5e1abe97ba.png"
                alt="1"
              />
            </p>
          </div>
          <div class="box">
            <div class="txt">
              <p>메뉴소개</p>
              <p>가장 맛있는 버거를 제공하는 프리미엄 QSR 브랜드 매장</p>
              <div class="btn">
                <p>메뉴 둘러보기</p>
                <p><img src="https://www.burgerking.co.kr/img/ico_move.svg" alt="">
              </div>
              </p>
            </div>
            <p>
              <img
                src="https://mob-prd.burgerking.co.kr/images/story/main/2025/01/20/ec0239ed-d960-4609-b232-1de08b62a08d.png"
                alt="1"
              />
            </p>
            </div>
          <div class="box">
            <div class="txt">
              <span>quality</span>
              <p>엄격한 품질 관리 시스템</p>
              <div class="btn">
                <p>Why 버거킹</p>
                <p><img src="https://www.burgerking.co.kr/img/ico_move.svg" alt="">
              </div>
              </p>
            </div>
            <p>
              <img
                src="https://mob-prd.burgerking.co.kr/images/story/web/2025/01/11/ffe6021e-201d-49d0-9a7d-61af82f64138.png"
                alt="1"
              />
            </p>
                </div>
        </div>
    </div>
    <div class="deli">
      <div class="txt">
        <h1>집에서 만나는 버거킹</h1>
        <p>딜리버리 전화주문 안내 9:00 - 19:00 / 연중무휴</p>
        <p>(매장별로 상이할 수 있습니다.)</p>
      </div>
      <div class="number">
        <p><img src="https://www.burgerking.co.kr/img/ico_delivery_home_banner.svg" alt="">
          <p>1599-0505</p>
        </p>
      </div>
    </div>
</body>
</html>
