<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
      font-family: "BKBulMatPro";
      src: url(./BKBulMatPro-Bold.woff);
    }
    @font-face {
      font-family: "SDGothic";
      src: url(./SDGothicNeoRound-hEb.otf);
    }
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
      background-color: #f5ebdc;
      padding: 0 150px 70px;
      width: 100%;
      max-width: 1670px;
      margin: 0 auto;
      font-family: "BKBulMatPro";
      color: #502314;
      }
      .ad {
        padding-bottom: 26px;
        margin-top: 60px;
      }
      .ad h1 {
        font-size: 42px;
      }
      .ad ul {
        display: flex;
        justify-content: center;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        
        } 
      .ad ul > li > a > img {
        width: 526px;
        height: 297px;
        object-fit: cover;
        border-radius: 20px;
        
      }
      .ad ul > li > p {
        text-align: center;
        font-size: 22px;
        padding: 20px;
        font-family:  "SDGothic";
      }
      .ad ul > li{
        position: relative;
        }
      .ad ul > li .btn {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
      }

    </style>
  </head>
  <body>
    <div class="ad">
      <h1>광고영상</h1>
        <div>
          <p>
            <a href="#"
              ><img
                src="https://mob-prd.burgerking.co.kr/images/story/main/2025/06/26/c446fd95-c6c0-4b92-a82f-c6aa8df5a161.jpg"
                alt=""
            /></a>
          </p>
          <p>할라피뇨 파퍼 - 1편</p>
          <p class="btn">
            <img src="https://www.burgerking.co.kr/img/btn_play.svg" alt="">
          </p>
        </div>
        <div>
          <a href="#"
            ><img
              src="https://mob-prd.burgerking.co.kr/images/story/main/2025/06/26/fd342a2c-6723-4bb9-88ac-f177b1e5d413.jpg"
              alt=""
          /></a>
          <p>할라피뇨 파퍼 - 2편</p>
          <p class="btn">
            <img src="https://www.burgerking.co.kr/img/btn_play.svg" alt="">
          </p>
        </div>
        <div>
          <a href="#"
            ><img
              src="https://mob-prd.burgerking.co.kr/images/story/main/2025/06/11/adb22742-6314-49a8-b250-ebabb2bf6864.png"
              alt=""
          /></a>
          <p>25년 6월 오리지널스 출시</p>
          <p class="btn">
            <img src="https://www.burgerking.co.kr/img/btn_play.svg" alt="">
          </p>
        </div>
      </ul>
    </div>
  </body>
</html>
