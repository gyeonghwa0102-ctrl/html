<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body{
        background: #eee;
      }
      .con {
        display: grid;
        width: 1800px;
        height: 3080px;
        margin: 0 auto;
        gap: 20px;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(7, 1fr);
      }
      .con .item {
        position: relative;
      }
      .con .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
      }
      .con .item .txt {
        position: absolute;
        left: 0;
        top: 0;
      }
      .con .item:nth-child(1) {
        grid-column: 1 / 5;
      }
      .con .item:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
      }
      .item:nth-child(3) {
        grid-column: 2 / 4;
        grid-row: 2;
      }
      .item:nth-child(4) {
        grid-column: 4;
        grid-row: 2;
      }
      .item:nth-child(5) {
        grid-column: 1 / 3;
        grid-row: 3 / 5;
      }
      .item:nth-child(6) {
        grid-column:3/4;
        grid-row: 3;
        background: #fff;
        border-radius: 20px;
      }
      .item:nth-child(7) {
        grid-column: 4;
        grid-row: 3;
      }
      .item:nth-child(8) {
        grid-column: 3;
        grid-row: 4;
      }
      .item:nth-child(9) {
        grid-column: 4;
        grid-row: 4;
      }
      .item:nth-child(10) {
        grid-column: 1;
        grid-row: 5;
      }
      .item:nth-child(11) {
        grid-column: 2;
        grid-row: 5;
        background: #fff;
        border-radius: 20px;
      }
      .item:nth-child(12) {
        grid-column: 3/4;
        grid-row: 5/6;
      }
      .item:nth-child(13) {
        grid-column: 1;
        grid-row: 6;
      }
      .item:nth-child(14) {
        grid-column: 2;
        grid-row: 6;
      }
      .item:nth-child(15) {
        grid-column: 1/3;
        grid-row: 7;
      }
      .item:nth-child(16) {
        grid-column: 3/5;
        grid-row: 7;
      }
    </style>
  </head>
  <body>
