<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spc</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #eee;
      }
      .con {
        display: grid;
        width: 1800px;
        height: 3080px;
        margin: 0 auto;
        gap: 20px;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(7, 1fr);
      }
      .con .item {
        position: relative;
      }
      .con .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
      }
      .con .item .txt {
        position: absolute;
        left: 8%;
        top: 5%;
        color: #fff;
        font-family: "Pretendard";
        font-size: 1.2rem;
        text-transform: uppercase;
      }
      .con .item:nth-child(1) .txt {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        /* text-wrap: wrap; */
      }
      .con .item:nth-child(1) .txt h1 {
        text-align: center;
        font-size: 54px;
      }
      .con .item:nth-child(1) .txt p {
        font-weight: bold;
        font-size: 106px;
        text-transform: none;
      }
      .con .item:nth-child(5) .txt {
        font-size: 146px;
        font-weight: bold;
        text-align: center;
        position: absolute;
        left: 30%;
        top: 20%;
      }
      .con .item:nth-child(6) .txt {
        text-align: center;
      }
      .con .item:nth-child(6) .txt h1 {
        font-size: 48px;
      }
      .con .item:nth-child(6) .txt p:first-child {
        font-size: 20px;
        color: rgba(0, 0, 0, 0.5);
      }
      .con .item:nth-child(6) .txt .btn {
        font-style: 18px;
        background: #f5f5f5;
        border-radius: 20px;
        padding: 0 30px;
      }
      /* 여기부터 그리드 */
      .con .item:nth-child(1) {
        grid-column: 1 / 5;
      }
      .con .item:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
      }
      .item:nth-child(3) {
        grid-column: 2 / 4;
        grid-row: 2;
      }
      .item:nth-child(4) {
        grid-column: 4;
        grid-row: 2;
      }
      .item:nth-child(5) {
        grid-column: 1 / 3;
        grid-row: 3 / 5;
      }
      .item:nth-child(6) {
        grid-column: 3/4;
        grid-row: 3;
        background: #fff;
        border-radius: 20px;
      }
      .item:nth-child(7) {
        grid-column: 4;
        grid-row: 3;
      }
      .item:nth-child(8) {
        grid-column: 3;
        grid-row: 4;
      }
      .item:nth-child(9) {
        grid-column: 4;
        grid-row: 4;
      }
      .item:nth-child(10) {
        grid-column: 1;
        grid-row: 5;
      }
      .item:nth-child(11) {
        grid-column: 2;
        grid-row: 5;
        background: #fff;
        border-radius: 20px;
      }
      .item:nth-child(12) {
        grid-column: 3/5;
        grid-row: 5/7;
      }
      .item:nth-child(13) {
        grid-column: 1;
        grid-row: 6;
      }
      .item:nth-child(14) {
        grid-column: 2;
        grid-row: 6;
      }
      .item:nth-child(15) {
        grid-column: 1/3;
        grid-row: 7;
      }
      .item:nth-child(16) {
        grid-column: 3/5;
        grid-row: 7;
      }
    </style>
  </head>
