<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
        font-family: "BKBulMatPro";
        src: url(./BKBulMatPro-Bold.woff);
      }
      @font-face {
        font-family: "SDGothic";
        src: url(./SDGothicNeoRound-hEb.otf);
      }
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
        padding: 0 150px 70px;
        max-width: 1670px;
        margin: 0 auto;
      }
      .top {
        width: 100%;
        height: 98px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: #f5ebdc;
      }
      .top .menu {
        position: relative;
      }
      .top .menu > ul {
        display: flex;
        gap: 20px;
        font-family: "BKBulMatPro";
        text-transform: uppercase;
      }
      .top .menu > ul > li > a {
        font-size: 24px;
        color: #502314;
      }
      .top .menu > ul > li .sub {
        width: 100%;
        height: 60px;
        transform: scaleY(0);
        transition: 0.1s;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-around;
        position: absolute;
        top: 50px;
        left: 0;
        background: #502314;
        border-radius: 30px;
        font-family: "SDGothic";
      }
      .top .menu > ul > li .sub > li > a {
        color: #fff;
      }
      .top .menu > ul > li:nth-child(2):hover .sub:nth-child(2) {
        transform: scaleY(1);
      }
      .top .menu > ul > li:nth-child(3):hover .sub:nth-child(3) {
        transform: scaleY(1);
      }
      .top .right {
        display: flex;
        align-items: center;
        background: #5023140d;
        border-radius: 20px;
        padding: 5px 13px;
        box-sizing: border-box;
        gap: 5px;
      }
      .top .right > p > a {
        font-family: "SDGothic";
        font-size: 13px;
        color: #502314;
        line-height: 30px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">
        <a href="#"
          ><img src="https://www.burgerking.co.kr/img/bg_logo.svg" alt=""
        /></a>
      </div>
      <div class="menu">
        <ul>
          <li><a href="#">menu</a></li>
          <li>
            <a href="#">story</a>
            <ul class="sub">
              <li><a href="#">브랜드</a></li>
              <li><a href="#">Why 버거킹</a></li>
              <li><a href="#">ESG 경영</a></li>
              <li><a href="#">Smart QSR</a></li>
              <li><a href="#">수상실적</a></li>
              <li><a href="#">광고영상</a></li>
            </ul>
          </li>
          <li>
            <a href="#">news</a>
            <ul class="sub">
              <li>이벤트</li>
              <li>공지사항</li>
            </ul>
          </li>
          <li><a href="#">store</a></li>
          <li><a href="#">customer</a></li>
        </ul>
      </div>
      <div class="right">
        <p>
          <img
            src="https://www.burgerking.co.kr/img/ico_tit_store.svg"
            alt=""
          />
        </p>
        <p><a href="#">가맹점 모집</a></p>
      </div>
    </div>
  </body>
</html>
