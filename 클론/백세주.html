<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #fefef2;
      }
      .top {
        width: 1745px;
        position: relative;
        margin: 0 auto;
      }
      .top ul {
        list-style: none;
        display: flex;
        justify-content: space-between;
        padding: 30px 0;
      }
      .top ul li {
        margin: 0 40px;
        font-family: "Pretendard";
        font-size: 15px;
      }
      .top p img {
        display: block;
        width: 242px;
        margin: 0 auto;
      }
      .v-line {
        border-left: 1px solid gray;
        border-right: 1px solid gray;
        position: absolute;
        left: 80px;
      }
      .img {
        text-align: center;
        position: relative;
      }
      .img p:nth-child(1) img {
        width: 1745px;
        height: 530px;
        margin: 100px auto;
        object-fit: cover;
      }
      .img p:nth-child(2) img {
        position: absolute;
        top: 50px;
        left: 850px;
        width: 167px;
        height: 589px;
      }
      .scroll {
        background-image: url(https://www.bekseju.com/images/ico-arrow-d.svg);
        background-repeat: no-repeat;
        background-size: 24px;
        background-position: center;
      }
      .scroll h6 {
        text-transform: uppercase;
        text-align: center;
        font-size: 14px;
        padding-bottom: 50px;
        font-family: "Pretendard";
      }
    </style>
  </head>
  <body>
    <div class="v-line">
      <div class="top">
        <ul>
          <li>Korean Traditional Wine</li>
          <li>BEKSEJU</li>
        </ul>
        <p>
          <a href="#"
            ><img src="https://www.bekseju.com/images/logo.svg" alt="logo"
          /></a>
        </p>
        <hr />
      </div>
      <div class="img">
        <p><img src="https://www.bekseju.com/images/mainbg.jpg" alt="" /></p>
        <p>
          <img src="https://www.bekseju.com/images/img-bottle.png" alt="" />
        </p>
      </div>
      <div class="scroll">
        <h6>scroll</h6>
      </div>
    </div>
  </body>
</html>
