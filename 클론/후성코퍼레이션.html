<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
        width: 1910px;
        margin: 0 auto;
      }
      nav {
        height: 91px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: #eee;
      }
      nav .menu {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      nav .right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      nav .right li a img {
        display: block;
        width: 30px;
      }
      main .visual {
        height: 100%;
        position: relative;
      }
      main .visual video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      main .visual .txt {
        position: absolute;
      }
      main .visual .txt h1 {
        font-size: 47.5px;
      }
      @keyframes down {
        0% {
          height: 0;
        }
        100% {
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <p>
        <a href="#"
          ><img
            src="http://www.foosungcorp.com/renewal/img/common/logo_2.png?1"
            alt=""
        /></a>
      </p>
      <ul class="menu">
        <li><a href="#">회사소개</a></li>
        <li><a href="#">사업영역</a></li>
        <li><a href="#">핵심가치</a></li>
        <li><a href="#">윤리경영</a></li>
        <li><a href="#">인재경영</a></li>
      </ul>
      <ul class="right">
        <li>
          <a href="#"
            ><img
              src="http://www.foosungcorp.com/eng/img/common/language.png"
              alt=""
          /></a>
        </li>
        <li>
          <a href="#"
            ><img
              src="	http://www.foosungcorp.com/kr/img/common/btn_search.png"
              alt=""
          /></a>
        </li>
        <li>
          <a href="#"
            ><img
              src="http://www.foosungcorp.com/kr/img/common/btn_panel.png"
              alt=""
          /></a>
        </li>
      </ul>
    </nav>
    <main>
      <div class="visual">
        <video autoplay muted loop>
          <source
            src="https://player.vimeo.com/video/1088607810?h=c6a7e8881f&autoplay=1&loop=1&autopause=0&mute=1&background=1&api=1&player_id=vvvvimeoVideo-957189"
            type="video/webm"
          />
        </video>
        <div class="txt">
          <h1>함께하는 미래를 열어갑니다.</h1>
        </div>
      </div>
    </main>
  </body>
</html>
