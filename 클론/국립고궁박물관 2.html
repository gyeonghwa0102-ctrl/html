<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 100%;
        height: 100%;
        margin: 0 auto;
      }

      .swiper-slide {
        background: url(https://online.gogung.go.kr/cmmn/file/imageSrc.do?atchFileId=70cff0eaba664585877fcd67cc6f63fd&fileSn=1);
        background-repeat: no-repeat;
        width: 249px;
      }

      .swiper-slide img {
        display: block;
        width: 196px;
        height: 286px;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img
            src="https://online.gogung.go.kr/html/onlinemuseum/resources/images/main/main_vr_img_1.png"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://online.gogung.go.kr/html/onlinemuseum/resources/images/main/main_vr_img_2.png"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://online.gogung.go.kr/html/onlinemuseum/resources/images/main/main_vr_img_3.png"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://online.gogung.go.kr/html/onlinemuseum/resources/images/main/main_vr_img_4.png"
            alt=""
          />
        </div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        slidesPerView: 1,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
