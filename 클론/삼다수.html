<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      .wrap {
        width: 100vw;
      }
      .top {
        width: 1500px;
        height: 90px;
        margin: 0 206px;
        padding-top: 50px;
        position: fixed;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .top .left img {
        width: 200px;
      }
      .top .right a {
        text-transform: uppercase;
        font-family: "Noto Sans";
        font-weight: 800;
        font-size: 18px;
      }
      .top .right img {
        width: 30px;
      }
      .main {
        width: 100%;
        height: 100%;
        margin: 0 auto;
        text-align: center;
      }
      .main .main1,
      .main .main2,
      .main .main3 {
        padding: 150px 90px;
      }
      .main .main1 {
        background-image: url(https://www.jpdc.co.kr/pub/site/samdasoo/new_images/bg_W.png);
      }
      .main .main2 {
        background-image: url(https://www.jpdc.co.kr/pub/site/samdasoo/new_images/bg_B.png);
      }
      .main .main3 {
        background-image: url(https://www.jpdc.co.kr/pub/site/samdasoo/new_images/bg_G.png);
      }
      .main .main1 div,
      .main .main2 div,
      .main .main3 div {
        font-family: "Noto Sans";
        padding: 0px 0 80px 0;
      }
      .main .main1 div h3 {
        font-size: 30px;
        color: #0066ff;
      }
      .main .main1 div p {
        font-size: 18px;
        color: #777;
      }
      .main .main2 div h3,
      .main .main3 div h3 {
        font-size: 30px;
        color: #fff;
      }
      .main .main2 div p,
      .main .main3 div p {
        font-size: 18px;
        color: #fff;
      }
      .main .main1 p:last-child img,
      .main .main2 p.con2 img,
      .main .main3 p.con2 img {
        position: relative;
        z-index: 1;
      }
      .main .main2 .btn {
        background-image: url(https://www.jpdc.co.kr/pub/site/samdasoo/new_images/btn_bg2.png);
        background-repeat: no-repeat;
        width: 166px;
        height: 53px;
        margin: 100px auto;
      }
      .main .main2 .btn a,
      .main .main3 .btn a {
        font-family: "Noto Sans";
        font-size: 17px;
        color: #fff;
        line-height: 53px;
      }
      .main .main3 .btn {
        background-image: url(https://www.jpdc.co.kr/pub/site/samdasoo/new_images/btn_bg3.png);
        background-repeat: no-repeat;
        width: 166px;
        height: 53px;
        margin: 50px auto;
      }
      p.water {
        position: fixed;
        left: 48%;
        top: 30%;
        transform: translate(-50px, -50px);
      }
      p.water img {
        width: 213px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <p class="left">
          <a href="#"
            ><img
              src="	https://www.jpdc.co.kr/pub/site/samdasoo/new_images/logo.png"
              alt=""
          /></a>
        </p>
        <div class="right">
          <a href="#">kor ∨</a>
          <a href="#"
            ><img
              src="https://www.jpdc.co.kr/pub/site/samdasoo/new_images/menu_b.png"
              alt=""
          /></a>
        </div>
      </div>
      <div class="main">
        <div class="main1">
          <div>
            <h3>THE WATER</h3>
            <p>깨끗하고, 건강하고, 맛있는 물</p>
          </div>
          <div>
            <p>
              <img
                src="https://www.jpdc.co.kr/pub/site/samdasoo/new_images/BETTER.png"
                alt=""
              />
            </p>
            <p>
              <img
                src="https://www.jpdc.co.kr/pub/site/samdasoo/new_images/CHOICE.png"
                alt=""
              />
            </p>
          </div>
        </div>
        <div class="main2">
          <div>
            <h3>ONLY ONE</h3>
            <p>진정한 제주다움 실현</p>
          </div>
          <div>
            <p>
              <img
                src="	https://www.jpdc.co.kr/pub/site/samdasoo/new_images/JEJU.png"
                alt=""
              />
            </p>
            <p class="con2">
              <img
                src="https://www.jpdc.co.kr/pub/site/samdasoo/new_images/SAMDASOO_T.png"
                alt=""
              />
            </p>
            <div class="btn"><a href="#">MORE +</a></div>
          </div>
        </div>
        <div class="main3">
          <div>
            <h3>SUSTAINABLE</h3>
            <p>제주의 청정 자연과 공존하는 제주삼다수</p>
          </div>
          <div>
            <p>
              <img
                src="	https://www.jpdc.co.kr/pub/site/samdasoo/new_images/JEJU.png"
                alt=""
              />
            </p>
            <p class="con2">
              <img
                src="https://www.jpdc.co.kr/pub/site/samdasoo/new_images/SAMDASOO_T.png"
                alt=""
              />
            </p>
            <div class="btn"><a href="#">MORE +</a></div>
          </div>
        </div>
      </div>
      <p class="water">
        <img
          src="https://www.jpdc.co.kr/pub/site/samdasoo/new_images/new_samdasoo.png"
          alt=""
        />
      </p>
    </div>
  </body>
</html>
