<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @font-face {
      font-family: "BKBulMatPro";
      src: url(./BKBulMatPro-Bold.woff);
    }
    @font-face {
      font-family: "SDGothic";
      src: url(./SDGothicNeoRound-hEb.otf);
    }
      * {
        margin: 0;
        padding: 0;
      }
      
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
     body{
      background-color: #f5ebdc;
     }
      .wrap{
        width: 100%;
        max-width: 1620px;
        margin: 0 auto;
        padding: 0 3.75rem;
        color:#502314;
      background-color: #f5ebdc}

      
      .ad{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1.25rem;
        font-family: "SDGothic";
        padding-bottom: 1.875rem;
        box-sizing: border-box;

        }
       h1 {
        font-size:2.625rem;
        font-family: "BKBulMatPro";
        margin: 1.875rem 0;
      }
      
      .ad div:first-child{
        grid-column: 1;

      }
      .ad div:nth-child(2){
        grid-column: 2;

      }
      .ad div:last-child{
        grid-column: 3;

      }
      .ad div{
        position: relative;
      }
      .ad div p{
        text-align: center;
        font-size: 1.375rem;
        font-family:  "SDGothic";
      }
      .ad div p>a> img{
        width: 100%;
        object-fit: cover;
        border-radius: 1.25rem;
      }
      .ad div .btn {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
      }
      @media screen and (max-width:1024px) {}
      @media screen and (max-width:640px){
      .ad{
        display: grid;
        grid-template-columns: 1fr;}
      .ad div:first-child{
        grid-column: 1;
      }  
      .ad div:nth-child(2){
        display: none;

      }
      .ad div:last-child{
       display: none;}
      }
</style>
  </head>
  <body>
    <div class="wrap">
        <h1>광고영상</h1>
      <div class="ad">
          <div>
            <p>
              <a href="#"
                ><img
                  src="https://mob-prd.burgerking.co.kr/images/story/main/2025/06/26/c446fd95-c6c0-4b92-a82f-c6aa8df5a161.jpg"
                  alt=""
              /></a>
            </p>
            <p>할라피뇨 파퍼 - 1편</p>
            <p class="btn">
              <img src="https://www.burgerking.co.kr/img/btn_play.svg" alt="">
            </p>
          </div>
          <div>
            <p>
              <a href="#"
                ><img
                  src="https://mob-prd.burgerking.co.kr/images/story/main/2025/06/26/fd342a2c-6723-4bb9-88ac-f177b1e5d413.jpg"
                  alt=""
              /></a>
            </p>
            <p>할라피뇨 파퍼 - 2편</p>
            <p class="btn">
              <img src="https://www.burgerking.co.kr/img/btn_play.svg" alt="">
            </p>
          </div>
          <div>
            <p>
              <a href="#"
                ><img
                  src="https://mob-prd.burgerking.co.kr/images/story/main/2025/06/11/adb22742-6314-49a8-b250-ebabb2bf6864.png"
                  alt=""
              /></a>
            </p>
            <p>25년 6월 오리지널스 출시</p>
            <p class="btn">
              <img src="https://www.burgerking.co.kr/img/btn_play.svg" alt="">
            </p>
          </div>
        </ul>
      </div>
    </div>
    <script>
      
    </script>
  </body>
</html>
