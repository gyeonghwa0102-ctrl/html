<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
        padding: 0 60px;
        width: 100%;
        margin: 0 auto;
        max-width: 1670px;
      }
      footer {
        width: 100%;
        height: 216px;
        background-color: #fffcf8;
        padding: 40px 60px;
        box-sizing: border-box;
      }
      footer .use {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-left: 210px;
      }
      footer .use li a {
        font-size: 12px;
        color: #856559;
      }
      footer .use li:nth-child(2) a {
        text-decoration: underline;
        color: #502314b3;
        font-weight: bold;
      }
      footer .use li:last-child {
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: #5023140d;
        width: 106px;
        border-radius: 20px;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      footer .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      footer .bottom .right {
        display: flex;
        gap: 20px;
        font-size: 12px;
        line-height: 20px;
        color: #856559;
      }
      footer .bottom .right ul li:nth-child(2) a {
        text-decoration: underline;
        color: #502314b3;
        font-weight: bold;
      }
      footer .bottom .left {
        display: flex;
        margin: 25px 0;
      }
      footer .bottom .left p img {
        margin-left: 20px;
      }
      footer .bottom .left .sns {
        display: flex;
      }
      footer .bottom .left .sns::after {
        content: "";
        background-color: #d4c8b7;
        width: 1px;
        height: 20px;
        margin: 10px 0 0 15px;
      }
      footer .bottom .left .sns img {
        width: 32px;
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <footer>
      <ul class="use">
        <li><a href="#">이용약관</a></li>
        <li><a href="#">개인정보처리방침</a></li>
        <li><a href="#">위치정보 이용약관</a></li>
        <li><a href="#">법적고지</a></li>
        <li><a href="#">고정형 영상정보처리기기 운영관리방침</a></li>
        <li>
          <a href="#">채용사이트</a
          ><img src="https://www.burgerking.co.kr/img/ico_bt_link.svg" alt="" />
        </li>
      </ul>
      <div class="bottom">
        <div class="right">
          <p>
            <img
              src="https://www.burgerking.co.kr/img/bg_logo_b.svg"
              alt="logo"
            />
          </p>
          <ul>
            <li>서울 특별시 종로구 삼봉로 71 G타워 4F,5F</li>
            <li>
              사업자등록번호 : 101-86-76277 <a href="#">사업자정보확인</a>
            </li>
            <li>통신판매업 신고 : 2016-서울종로-1050</li>
            <li>㈜ 비케이알 대표이사 : 이동형</li>
            <li>ⓒBKR Co., Ltd. All right Reserved</li>
          </ul>
        </div>
        <div class="left">
          <ul class="sns">
            <li>
              <a href="#"
                ><img
                  src="https://www.burgerking.co.kr/img/ico_sns_instagram.svg"
                  alt=""
              /></a>
            </li>
            <li>
              <a href="#"
                ><img
                  src="https://www.burgerking.co.kr/img/ico_sns_facebook.svg"
                  alt=""
              /></a>
            </li>
            <li>
              <a href="#"
                ><img
                  src="https://www.burgerking.co.kr/img/ico_sns_x.svg"
                  alt=""
              /></a>
            </li>
            <li>
              <a href="#"
                ><img
                  src="https://www.burgerking.co.kr/img/ico_sns_youtube.svg"
                  alt=""
              /></a>
            </li>
          </ul>
          <p>
            <a href="#"
              ><img
                src="https://www.burgerking.co.kr/img/ico_timhortons.svg"
                alt=""
            /></a>
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
