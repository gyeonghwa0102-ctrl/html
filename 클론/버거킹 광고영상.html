<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      body {
        background-color: #f5ebdc;
        padding: 0 60px;
      }
      .ad {
        width: 100%;
        max-width: 1780px;
        margin: 0 auto;
        padding: 0 30px;
        padding-bottom: 26px;
      }
      .ad h1 {
        font-size: 42px;
      }
      .ad ul {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .ad ul > li > a > img {
        width: 526px;
        height: 297px;
        object-fit: cover;
        border-radius: 30px;
        position: relative;
      }
      .ad ul > li .btn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background-image: url(https://www.burgerking.co.kr/img/btn_play.svg);
      }
      .ad ul > li > p {
        text-align: center;
        font-size: 22px;
        padding: 20px;
      }
      .itro {
        width: 100%;
        max-width: 1780px;
        margin: 0 auto;
        padding: 0 30px;
      }
      .itro h1{
        font-size: 42px;
        margin-bottom: 24px;
      }
      .itro .box {
        background-color: #fff;
        border-radius: 30px;
        width: 526px;
        height: 508px;
        overflow: hidden;
      }
      .itro .box p img {
        width: 100%;
        object-fit: cover;
        
      }
      .itro .box .txt{
        padding: 20px;
      }
      .itro .box .txt >p:first-child{
        background-color: #f5ebdc;
        width: 60px;
        text-align: center;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
      }
      .itro .box .txt p:nth-child(2){
        margin: 15px;
        font-size: 22px;
      }
      
      .itro .box .txt .btn{
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }
      .itro .box .txt .btn p{
        font-size: 20px;
      }
      .itro .box .txt .btn p img{
        height: 34px;
        
      }
    </style>
  </head>

      <ul>
