<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .swiper-wrapper {
        position: relative;
      }
      .swiper-slide img {
        width: 100%;
        object-fit: cover;
      }
      .swiper-button-prev {
        position: absolute;
        top: 75%;
        left: 68%;
      }
      .swiper-button-next {
        position: absolute;
        top: 75%;
        left: 73%;
      }
      .swiper-button-next:after,
      .swiper-button-prev:after {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102746.11%20%EA%B2%A8%EC%9A%B8%EC%8B%9C%EC%A6%8C_%EB%A9%94%EC%9D%B8%EB%B0%B0%EB%84%88(pc)_%EC%8A%88%ED%86%A8%EB%A0%8C(%ED%95%9C%EC%A0%95%ED%8C%90%EB%A7%A4)_1920x1080px(1)"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102500.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102152.11%20%EA%B2%A8%EC%9A%B8%EC%8B%9C%EC%A6%8C_%EB%A9%94%EC%9D%B8%EB%B0%B0%EB%84%88(pc)_%ED%81%AC%EB%A6%AC%EC%8A%A4%EB%A7%88%EC%8A%A4_1920x1080px"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251107160153.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251107160036.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102633.jpg"
            alt=""
          />
        </div>
      </div>
      <div class="swiper-button-next">
        <img
          src="https://www.coffeebay.com/img/main/main_slide_next_btn.png"
          alt=""
        />
      </div>
      <div class="swiper-button-prev">
        <img
          src="https://www.coffeebay.com/img/main/main_slide_prev_btn.png"
          alt=""
        />
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        centeredSlides: true,
        loop: true,
        effect: "fade",
        speed: 1000,
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
