<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      .list {
        width: 95%;
        max-width: 1420px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .list li {
        flex: 1;
        cursor: pointer;
        position: relative;
      }
      .list li img {
        width: 100%;
        object-fit: cover;
      }
      .list li .txt {
        position: absolute;
        left: 20%;
        top: 30%;
        font-size: 30px;
        text-align: center;
        color: #fff;
        display: flex;
        flex-wrap: wrap;
        flex-direction: column;
      }
      .list li .txt .detail {
        display: none;
      }
      .list li .txt .detail.on {
        display: block;
      }
      .list li .txt .detail p {
        font-size: 22px;
        margin: 50px 0;
      }
      .list li .txt .detail span {
        background: #fff;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        color: #000;
        display: block;
      }
    </style>
  </head>
  <body>
    <ul class="list">
      <li>
        <img
          src="https://corp.oliveyoung.com/img/sustain/img_sustain_pc_1.jpg"
          alt=""
        />
        <div class="txt">
          <p>협력사 상생</p>
          <div class="detail">
            <p>
              입점 브랜드의 성장과 <br />글로벌 진출을 <br />함께하는 파트너
            </p>
            <span>↗</span>
          </div>
        </div>
      </li>
      <li>
        <img
          src="https://corp.oliveyoung.com/img/sustain/img_sustain_pc_2.jpg"
          alt=""
        />
        <div class="txt">
          <p>협력사 상생</p>
          <div class="detail">
            <p>
              입점 브랜드의 성장과 <br />글로벌 진출을 <br />함께하는 파트너
            </p>
            <span>↗</span>
          </div>
        </div>
      </li>
      <li>
        <img
          src="https://corp.oliveyoung.com/img/sustain/img_sustain_pc_3.jpg"
          alt=""
        />
        <div class="txt">
          <p>협력사 상생</p>
          <div class="detail">
            <p>
              입점 브랜드의 성장과 <br />글로벌 진출을 <br />함께하는 파트너
            </p>
            <span>↗</span>
          </div>
        </div>
      </li>
      <li>
        <img
          src="https://corp.oliveyoung.com/img/sustain/img_sustain_pc_4.jpg"
          alt=""
        />
        <div class="txt">
          <p>협력사 상생</p>
          <div class="detail">
            <p>
              입점 브랜드의 성장과 <br />글로벌 진출을 <br />함께하는 파트너
            </p>
            <span>↗</span>
          </div>
        </div>
      </li>
    </ul>
    <script>
      document.querySelectorAll(".list li").forEach(function (v, k, ar) {
        v.onmouseenter = function () {
          ar.forEach(function (v, i) {
            v.querySelector(
              "img"
            ).src = `https://corp.oliveyoung.com/img/sustain/img_sustain_pc_hover_${
              k + 1
            }_${i + 1}.jpg`;
            v.querySelector("div").classList.remove("on");
          });
          v.querySelector("div").classList.add("on");
        };
        v.onmouseleave = () => {
          ar.forEach(function (v, i) {
            v.querySelector(
              "img"
            ).src = `https://corp.oliveyoung.com/img/sustain/img_sustain_pc_${
              i + 1
            }.jpg`;
          });
        };
      });

      //https://corp.oliveyoung.com/img/sustain/img_sustain_pc_hover_1_1.jpg
    </script>
  </body>
</html>
