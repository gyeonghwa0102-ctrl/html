<!DOCTYPE html>
<html>
  <head>
    <style>
      .list {
        background-color: blue !important;
      }
    </style>
    <script>
      function myFunction() {
        document.getElementById("demo").innerHTML = "Paragraph <br> changed.";
      }
    </script>
  </head>
  <body>
    <h2>Demo JavaScript in Head</h2>
    <p id="demo">A Paragraph</p>
    <ul>
      <li class="list">1</li>
      <li class="list">2</li>
      <li class="list">3</li>
      <li class="list">4</li>
    </ul>
    <button type="button" id="btn">try it</button>
    <script>
      document.getElementsByClassName("list")[0].style.backgroundColor = "red";
      document.getElementsByClassName("list")[0].style.fontsize = "50px";
      document.getElementsByTagName("ul")[0].style.border = "1px solid";
    </script>
  </body>
</html>
