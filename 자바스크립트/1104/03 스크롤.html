<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        height: 2000px;
      }
      #bar {
        background: #0bd;
        position: fixed;
        height: 10px;
        left: 0;
        top: 0;
      }
      section {
        height: 2000px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <section></section>
    </div>
    <script>
      function myscroll() {
        let scrolled = window.scrollY;
        console.log(scrolled);
        let ht = document.documentElement.scrollHeight;
        let viewht = document.documentElement.clientHeight;
        console.log(ht);
        console.log(viewht);
        let wd = (scroll / (ht - viewht)) * 100;
        console.log(wd);
        document.querySelector("#bar").style.widht = `${wd}%`;
      }
      window.onscroll = function () {
        myscroll();
      };
    </script>
  </body>
</html>
