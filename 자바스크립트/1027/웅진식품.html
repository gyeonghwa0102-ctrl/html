    <script>
      document.querySelectorAll(".kind").classlist.add("on");
      document.querySelectorAll(".content li").style.display = "#71b200";
      document.querySelectorAll(".kind li").forEach(function (v, i, ar) {
        v.onclick = function () {
          console.log(v);
          console.log(i);
          console.log(ar);
          ar.forEach(function (v) {
            v.classList.remove("on");
          });
          v.classList.add("on");
          document.querySelectorAll(".content li").forEach(function (v) {
            v.style.display = "none";
          });
          document.querySelectorAll(".content li")[i].style.display = "#71b200";
        };
      });
