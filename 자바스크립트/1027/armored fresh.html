<!DOCTYPE html>

  <head>

    <title>Document</title>
    <style>
      * {

        padding: 0;

      ul {
        list-style: none;

      .obj {

      }

      }
      .con {

      .con li {
        /* display: none; */
        position: absolute;
        left: 0;
        top: 0;
      }
