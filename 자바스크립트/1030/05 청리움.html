<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버튼</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      body{
        width: 1720px;
        margin: 0 auto;
        

      }
      .txt {padding: 23px 0 73px;
        box-sizing: border-box;
        
      }
      .txt h2 {
        font-size: 64px;
        margin-bottom: 30px;
      }
      .txt p {
        font-size: 22px;
      }
      .btn {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .btn >li {
        color: #b2b2b2;
      }
      .btn >li.on{
        color: #000;
        border: 1px solid;
        border-radius: 10px;
        padding: 10px;
      }
      .img{
        position: relative;
        height: 640px;
      }
      .img >li img{
        text-align: center;
        border-radius: 10px;
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="txt">
      <h2>공간안내</h2>
      <p>
        고즈넉한 자연 속 사계절의 아름다운 정취가 있는 청리움의 공간을
        안내합니다
      </p>
        <ul class="btn">
          <li>강당동</li>
          <li>연수동</li>
          <li>카페테리아</li>
          <li>잔디마당</li>
          <li>오하산방</li>
          <li>약초원</li>
          <li>명당 기도터</li>
          <li>녹차·포도밭</li>
        </ul>
        <ul class="img">
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_1.jpg" alt=""></p></li>
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_2.jpg" alt=""></p></li>
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_3.jpg" alt=""></p></li>
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_4.jpg" alt=""></p></li>
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_5.jpg" alt=""></p></li>
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_6.jpg" alt=""></p></li>
          <li><p><img src="https://www.cheongrium.com/static/images/spaceinfo/main_space_7.jpg" alt=""></p></li>

        </ul>

      </div>
    </div>
    <script>
      let btn = document.querySelectorAll(".btn li");
      let photo = document.querySelectorAll(".img li");
      btn[0].querySelector("a").classList.add("on");
      photo[0].classList.add("on");
      btn.forEach(function (v, k) {
        v.onclick = function () {
          v.querySelector("li").classList.remove("on");
        };
      });
      this.querySelector("li").classList.add("on");
      photo.forEach(function (v) {
            v.classList.remove("on");
          });
          photo[k].classList.add("on");
    </script>
  </body>
</html>
