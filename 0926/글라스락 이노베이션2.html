<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글라스락</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      a {
        text-decoration: none;
        color: #fff;
        font-family: "Pretendard";
      }
      ul {
        list-style: none;
      }
      .wrap {
        width: 100%;
        height: 100vh;
        background-size: cover;
        background-image: url(https://www.glasslock.co.kr/pages/layout/_glasslock/images/sub/innovation/bg_inno1.jpg);
      }
      .top {
        display: flex;
        justify-content: space-between;
        padding: 50px 100px;
      }
      .top img {
        width: 150px;
        filter: invert() sepia() saturate(1%) hue-rotate(143deg) brightness();
      }
      .top .right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .top .right > a {
        font-size: 14px;
        margin: 0 15px 0 0;
        text-decoration: underline;
        text-underline-offset: 5px;
        text-decoration-color: #fff;
      }
      .top .right .mall a {
        font-size: 14px;
        margin: 0 0 0 5px;
      }
      .top .right .mall {
        display: flex;
        align-items: center;
        border: 1px solid #fff;
        border-radius: 50px;
        padding: 3px 15px;
      }
      .top .right .mall a img {
        width: 20px;
      }
      .top .btn label {
        display: block;
        width: 30px;
        height: 30px;
      }
      .top .btn label span {
        display: block;
        height: 0.5px;
        background-color: #fff;
      }
      .top .btn label span .bar1 {
        width: 100%;
        height: 18px;
      }
      .main {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .main h2 {
        position: absolute;
        color: #fff;
        font-size: 5em;
        font-weight: 200;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <p>
          <a href="#"
            ><img
              src="	https://www.glasslock.co.kr/pages/layout/_glasslock/images/common/logo.svg"
              alt="logo"
          /></a>
        </p>
        <div class="right">
          <div class="mall">
            <a href="#"
              ><img
                src="	https://www.glasslock.co.kr/pages/layout/_glasslock/images/common/ico_topmall_cart_bk.svg"
                alt=""
            /></a>
            <a href="#">글라스락몰</a>
          </div>
          <a href="#">한국어</a>
          <div class="btn">
            <input type="checkbox" name="menu" id="menu" />
            <label for="menu">
              <span class="bar1"></span>
              <span class="bar2"></span>
              <span class="bar3"></span>
            </label>
          </div>
        </div>
      </div>
      <div class="main">
        <h2>INNOVATION</h2>
      </div>
    </div>
  </body>
</html>
